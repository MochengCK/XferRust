name: CI

# 触发：push 到 main、PR、手动。
# 每次 push 到 main 都会构建+测试；release 作业随后按代码版本号自动管理 Release（默认草稿，不直接发布）：
# 无对应版本 → 自动创建草稿；草稿已存在 → 每次构建覆盖产物并按最新双语模板
# （.github/RELEASE_EN.md / .github/RELEASE_ZH.md）重新生成说明；已发布 → 不覆盖。
# 确认无误后手动在 Releases 页发布。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 构建：3 平台各自产出 TUI(xfer) 与引擎内核(xferrust) 两个二进制。
  # macOS 在 arm64 运行器上同时编译 arm64 + x86_64 并 lipo 合成通用二进制。
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            targets: ""
          - os: windows-latest
            artifact: windows-x86_64
            targets: ""
          - os: macos-latest
            artifact: darwin-universal
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Build + smoke test (Linux / Windows)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          EXT=; [ "$RUNNER_OS" = "Windows" ] && EXT=.exe
          cargo build --release --bin xfer --bin xferrust
          mkdir -p dist
          cp "target/release/xfer$EXT" "dist/xfer$EXT"
          cp "target/release/xferrust$EXT" "dist/xferrust$EXT"
          "dist/xfer$EXT" --version
          "dist/xferrust$EXT" --version

      - name: "Build + smoke test (macOS universal: Intel + Apple Silicon)"
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cargo build --release --target aarch64-apple-darwin --bin xfer --bin xferrust
          cargo build --release --target x86_64-apple-darwin --bin xfer --bin xferrust
          mkdir -p dist
          lipo -create -output dist/xfer \
            target/aarch64-apple-darwin/release/xfer \
            target/x86_64-apple-darwin/release/xfer
          lipo -create -output dist/xferrust \
            target/aarch64-apple-darwin/release/xferrust \
            target/x86_64-apple-darwin/release/xferrust
          file dist/xfer
          "dist/xfer" --version
          "dist/xferrust" --version

      - name: Package artifacts (TUI 与引擎内核分开打包)
        shell: bash
        run: |
          EXT=; [ "$RUNNER_OS" = "Windows" ] && EXT=.exe
          # TUI 版：仅 xfer，命名明确标注 -tui
          mkdir -p pkg-xfer
          cp "dist/xfer$EXT" "pkg-xfer/xfer$EXT"
          cp LICENSE README.md pkg-xfer/
          tar -C pkg-xfer -czf "xfer-tui-${{ matrix.artifact }}.tar.gz" "xfer$EXT" LICENSE README.md
          # 引擎内核版（无 TUI）：仅 xferrust
          mkdir -p pkg-xferrust
          cp "dist/xferrust$EXT" "pkg-xferrust/xferrust$EXT"
          cp LICENSE README.md pkg-xferrust/
          tar -C pkg-xferrust -czf "xferrust-${{ matrix.artifact }}.tar.gz" "xferrust$EXT" LICENSE README.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.artifact }}
          path: |
            xfer-tui-${{ matrix.artifact }}.tar.gz
            xferrust-${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 严格测试：3 平台各自黑盒测试编译产物（引擎运行 / HTTP / HTTPS / 磁力）
  # ---------------------------------------------------------------------------
  test:
    name: Test ${{ matrix.artifact }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: windows-latest
            artifact: windows-x86_64
          - os: macos-latest
            artifact: darwin-universal
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.artifact }}
          path: bin/

      - name: Extract binaries
        shell: bash
        run: |
          mkdir -p bin
          tar -xzf "bin/xfer-tui-${{ matrix.artifact }}.tar.gz" -C bin
          tar -xzf "bin/xferrust-${{ matrix.artifact }}.tar.gz" -C bin
          ls -la bin

      - name: Run strict functional tests
        shell: bash
        env:
          PYTHONUTF8: "1"
          # HTTPS 测试源：需为公开可访问的稳定文件（私有仓库的 raw 链接会 404）。
          # 如你有自建镜像/文件源，改这一行即可。
          HTTPS_URL: https://raw.githubusercontent.com/torvalds/linux/master/README
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          $PY scripts/ci_test.py \
            --xfer "bin/xfer" \
            --xferrust "bin/xferrust" \
            --out "test-out" \
            --token ci \
            --https-url "$HTTPS_URL"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.artifact }}
          path: test-out/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 发布：构建+测试全绿后，按代码版本号自动管理 Release（默认草稿，不直接发布）。
  # - 无 v<版本> Release → 首次创建为草稿
  # - v<版本> 是草稿     → 每次构建覆盖产物，并按最新双语模板重新生成说明（一直覆盖，
  #                        注意：GitHub 草稿页的手工说明编辑会被模板内容替换）
  # - v<版本> 已发布     → 不覆盖（跳过，保持已发布版本不动）
  # 说明模板：.github/RELEASE_EN.md（英文，默认显示）+ .github/RELEASE_ZH.md（中文），
  # 每次发布前更新模板内容即可；顶部总标题与双语切换锚点由 CI 统一添加，
  # {{version}} 占位符自动替换为实际版本号。
  # 确认无误后，在 GitHub Releases 页手动点 "Publish release" 发布。
  # ---------------------------------------------------------------------------
  release:
    name: Release (草稿/不覆盖已发布)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: "Create or update release draft (产物与说明每次按模板覆盖)"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -1)"
          [ -n "$VERSION" ] || { echo "无法从 Cargo.toml 提取版本号"; exit 1; }
          TAG="v${VERSION}"
          echo "当前代码版本: ${TAG}"
          ls -1 artifacts/*.tar.gz

          # 已发布版本不动（CI 只自动管理草稿）
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$IS_DRAFT" = "false" ]; then
            echo ">>> ${TAG} 已发布 → 不覆盖已发布版本，跳过"
            exit 0
          fi

          # 说明拼装：固定双语模板 + {{version}} 替换；
          # 各语言段的开头标题与切换锚点由 CI 统一添加，模板文件里只写摘要与正文
          EN_FILE=".github/RELEASE_EN.md"
          ZH_FILE=".github/RELEASE_ZH.md"
          BODY_FILE=""
          if [ -f "$EN_FILE" ] || [ -f "$ZH_FILE" ]; then
            BODY_FILE="release_body.md"
            {
              echo '<a name="english"></a>'
              echo ""
              echo "# XferRust v${VERSION} Release Notes"
              echo ""
              echo '**English** | [简体中文](#简体中文)'
              echo ""
              sed -e "s/{{version}}/v${VERSION}/g" "$EN_FILE" 2>/dev/null || true
              echo ""
              echo "---"
              echo ""
              echo '<a name="简体中文"></a>'
              echo ""
              echo "# XferRust v${VERSION} 发布说明"
              echo ""
              echo '**[English](#english)** | 简体中文'
              echo ""
              sed -e "s/{{version}}/v${VERSION}/g" "$ZH_FILE" 2>/dev/null || true
            } > "$BODY_FILE"
          else
            echo ">>> 未找到 RELEASE_EN/RELEASE_ZH 模板文件，说明不做更新"
          fi

          if [ "$IS_DRAFT" = "true" ]; then
            echo ">>> 草稿 ${TAG} 已存在 → 覆盖产物，说明按最新模板重新生成（一直覆盖）"
            gh release upload "$TAG" artifacts/*.tar.gz --clobber
            [ -z "$BODY_FILE" ] || gh release edit "$TAG" --title "v${VERSION}" --notes-file "$BODY_FILE"
          else
            echo ">>> 无 ${TAG} Release → 首次创建为草稿"
            if [ -n "$BODY_FILE" ]; then
              gh release create "$TAG" artifacts/*.tar.gz \
                --title "v${VERSION}" --draft --notes-file "$BODY_FILE"
            else
              gh release create "$TAG" artifacts/*.tar.gz \
                --title "v${VERSION}" --draft --generate-notes
            fi
          fi
