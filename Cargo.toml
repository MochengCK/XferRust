[workspace]
members = ["crates/*"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots", "stream"] }
tokio-util = { version = "0.7", features = ["rt"] }
# asm：x86/x86_64 上用 SHA-NI 硬件指令（带运行时检测），
# 大文件校验/做种哈希显著加速；其他架构自动回退纯软件实现
sha1 = { version = "0.10", features = ["asm"] }
sha2 = "0.10"
md-5 = "0.10"
getrandom = "0.3"
# 字符集解码（中文站点常用 GBK/GB2312 的百分号编码，见 xfer-types::text）
encoding_rs = "0.8"
base64 = "0.22"
# 局域网传输（xfer-lan）：纯 Rust 密码学，可交叉编译到 Android
# - ecdh：P-256 ECDH（协议 2.1 的会话密钥）
# - aes：AES-256-GCM 分帧；alloc：密文/明文走 Vec
p256 = { version = "0.13", default-features = false, features = ["ecdh", "std"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.12"
crossterm = "0.28"
ratatui = "0.28"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }

# 根 bin：引擎守护进程入口
[package]
name = "xferrust"
description = "用 Rust 编写的独立下载引擎，支持 HTTP(S) 与 BitTorrent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xfer-types = { path = "crates/xfer-types" }
xfer-rpc = { path = "crates/xfer-rpc" }
xfer-engine = { path = "crates/xfer-engine" }
xfer-geo = { path = "crates/xfer-geo" }
xfer-lan = { path = "crates/xfer-lan" }
unicode-width = { version = "0.1", optional = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
crossterm = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }

# TUI feature：crossterm + ratatui + WS RPC 客户端。
# Android 等无终端平台只构建引擎内核（xferrust），不启用此 feature。
[features]
default = ["tui"]
tui = [
    "dep:crossterm",
    "dep:ratatui",
    "dep:unicode-width",
    "dep:tokio-tungstenite",
    "dep:base64",
    "dep:futures-util",
]

# TUI 二进制：仅在启用 tui feature 时构建（Android 等平台禁用）
[[bin]]
name = "xfer"
path = "src/bin/xfer.rs"
required-features = ["tui"]

# 发布体积优化：
# - strip=true        删除符号表/调试信息（省 ~18-20%，无行为影响）
# - lto="fat"         全量 LTO，跨 crate 消除未用代码（比 thin 更彻底，编译更慢）
# - opt-level="s"     按体积优化编译（-Os），进一步压缩代码段（换取少量运行时开销）
[profile.release]
lto = "fat"
codegen-units = 1
# 性能优先：opt-level="s" 会关闭向量化与部分循环优化，BT 收发、SHA-1 校验、
# 分片读写等热点明显变慢；二进制体积由 lto + strip 控制，仍保持单文件发布。
opt-level = 3
strip = true
